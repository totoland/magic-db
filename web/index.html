<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sqlmcp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: "#09090b", 900: "#0c0c10", 800: "#15151c", 700: "#1f1f2a" },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="h-full bg-ink-950 text-zinc-200 antialiased overflow-hidden">
  <div class="h-full flex">
    <div id="sidebarOverlay" class="fixed inset-0 z-30 bg-black/50 hidden md:hidden"></div>
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 max-w-[85vw] border-r border-zinc-800 bg-ink-900 flex flex-col min-h-0 transform -translate-x-full transition-transform duration-200 md:static md:translate-x-0 md:max-w-none">
      <div class="p-4 flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-blue-600/20 text-blue-400 grid place-items-center font-semibold">SQL</div>
        <div class="min-w-0 flex-1">
          <h1 class="text-sm font-semibold text-white">sqlmcp</h1>
          <p class="text-xs text-zinc-500">SQL client + MCP</p>
        </div>
        <button type="button" id="closeSidebar" class="md:hidden rounded-lg border border-zinc-700 px-2 py-1 text-sm text-zinc-300">Close</button>
      </div>
      <div class="px-4 pb-3">
        <button id="newConn" class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2">New connection</button>
      </div>
      <div class="px-4 text-[11px] uppercase tracking-wider text-zinc-500">Connections</div>
      <div id="connList" class="px-3 py-2 space-y-1 overflow-auto max-h-40 md:max-h-48"></div>
      <div class="px-4 pt-2 text-[11px] uppercase tracking-wider text-zinc-500">Tables</div>
      <div id="tableList" class="px-3 py-2 space-y-1 overflow-auto flex-1"></div>
    </aside>
    <main class="flex-1 min-w-0 min-h-0 grid grid-rows-[auto_minmax(140px,32vh)_1fr] md:grid-rows-[52px_220px_1fr]">
      <header class="flex flex-wrap items-center justify-between gap-2 px-3 py-2 md:px-4 md:py-0 border-b border-zinc-800 bg-ink-900">
        <div class="flex items-center gap-2 min-w-0">
          <button type="button" id="openSidebar" class="md:hidden rounded-lg border border-zinc-700 px-2 py-1 text-sm">Menu</button>
          <div id="activeMeta" class="text-sm text-zinc-400 truncate">No connection</div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <label class="flex items-center gap-2 text-sm text-zinc-400">
            <input type="checkbox" id="allowWrite" class="rounded border-zinc-700 bg-ink-800" />
            <span class="hidden sm:inline">Allow writes</span>
            <span class="sm:hidden">Write</span>
          </label>
          <button id="runBtn" class="rounded-lg bg-zinc-100 text-zinc-900 text-sm font-medium px-3 py-1.5 hover:bg-white">Run</button>
        </div>
      </header>
      <div id="editorWrap" class="min-h-0 overflow-hidden">
        <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM ..."></textarea>
      </div>
      <section class="min-h-0 overflow-auto">
        <div id="status" class="px-3 md:px-4 py-2 text-sm text-zinc-500">Ready · Ctrl-Space for autocomplete</div>
        <div class="overflow-auto">
          <table id="grid" class="min-w-full text-sm"></table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="connDialog" class="w-[28rem] max-w-[92vw] rounded-2xl border border-zinc-800 bg-ink-800 text-zinc-200 p-0 backdrop:bg-black/60">
    <form id="connForm" class="p-5 space-y-3">
      <h2 class="text-base font-semibold text-white">Connection</h2>
      <label class="block text-xs text-zinc-400">Name<input name="name" required class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">Driver
        <select name="driver" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100">
          <option value="sqlite">SQLite</option>
          <option value="postgres">PostgreSQL</option>
          <option value="mysql">MySQL</option>
          <option value="mssql">SQL Server</option>
        </select>
      </label>
      <label class="block text-xs text-zinc-400">Host / SQLite path<input name="host" placeholder="127.0.0.1 or /path/to.db" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">Port<input name="port" type="number" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">User<input name="user" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">Password<input name="password" type="password" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">Database<input name="database" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="block text-xs text-zinc-400">DSN override<input name="dsn" placeholder="optional full DSN" class="mt-1 w-full rounded-lg bg-ink-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100" /></label>
      <label class="flex items-center gap-2 text-sm text-zinc-300"><input type="checkbox" name="readOnly" checked class="rounded border-zinc-700" /> Read-only (blocks writes)</label>
      <p id="testResult" class="text-sm min-h-5"></p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" class="rounded-lg border border-zinc-700 px-3 py-1.5 text-sm" id="testConn">Test</button>
        <button type="button" class="rounded-lg border border-zinc-700 px-3 py-1.5 text-sm" id="cancelConn">Cancel</button>
        <button type="submit" class="rounded-lg bg-blue-600 px-3 py-1.5 text-sm text-white" id="saveConn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/sql-hint.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
